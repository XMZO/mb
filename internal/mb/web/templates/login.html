{{define "login"}}{{template "layout" .}}{{end}}
{{define "content"}}
  <div class="row justify-content-center mt-4">
    <div class="col-12 col-md-6 col-lg-4">
      <div class="p-4 rounded-4 bg-panel">
        <h4 class="mb-3">管理员登录</h4>
        {{if .PublicMode}}
          <div class="alert alert-info">当前为公开只读模式；登录后可管理数据。</div>
        {{else}}
          <div class="alert alert-secondary">当前为私有模式；需登录才能访问。</div>
        {{end}}
        {{if .Error}}
          <div class="alert alert-danger">{{.Error}}</div>
        {{end}}
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button class="btn btn-light w-100">登录</button>
        </form>
      </div>
      <div class="text-muted-2 small mt-3">默认端口：15000（可用 <span class="mono">MB_ADDR</span> 修改）</div>
    </div>
  </div>
{{end}}
