services:
  mb:
    image: ${MB_IMAGE:-ghcr.io/xmzo/mb:latest}
    container_name: ${MB_CONTAINER_NAME:-mb}
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "15000:15000"
    environment:
      MB_DB: "/data/mb.db"
    volumes:
      - "./data:/data"
    healthcheck:
      test: ["CMD", "/usr/local/bin/mb", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
