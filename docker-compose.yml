services:
  mb:
    image: ${MB_IMAGE:-ghcr.io/xmzo/mb:latest}
    container_name: ${MB_CONTAINER_NAME:-mb}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MB_ADDR: ":15000"
      MB_DB: "/data/mb.db"
    ports:
      - "${MB_HTTP_PORT:-15000}:15000"
    volumes:
      - ${MB_DATA_VOLUME:-mb-data}:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:15000/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mb-data:
