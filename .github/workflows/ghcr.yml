name: Test and publish GHCR image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.24.3"

jobs:
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            optional: false
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            optional: false
          - name: windows-amd64
            runner: windows-2025
            optional: false
          - name: windows-arm64
            runner: windows-11-arm
            optional: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Test
        run: go test ./...

  build-binaries:
    name: Build binary (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            output: mb-linux-amd64
            optional: false
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            output: mb-linux-arm64
            optional: false
          - name: windows-amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            output: mb-windows-amd64.exe
            optional: false
          - name: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            output: mb-windows-arm64.exe
            optional: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -buildid=" -o "dist/${{ matrix.output }}" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14

  docker-image:
    name: Build image (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.artifact }}
          cache-to: type=gha,scope=${{ matrix.artifact }},mode=max
          provenance: false
          sbom: false

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  windows-container-image:
    name: Build image (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows/amd64
            runner: windows-2022
            goarch: amd64
            artifact: windows-amd64
            base: mcr.microsoft.com/windows/nanoserver:ltsc2022
            optional: false
          - platform: windows/arm64
            runner: windows-11-arm
            goarch: arm64
            artifact: windows-arm64
            base: mcr.microsoft.com/windows/nanoserver:ltsc2022
            optional: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Set lowercase image name
        shell: pwsh
        run: |
          $imageName = "ghcr.io/$($env:GITHUB_REPOSITORY.ToLowerInvariant())"
          "IMAGE_NAME=$imageName" >> $env:GITHUB_ENV
          "WINDOWS_TEMP_TAG=$imageName:ci-$($env:GITHUB_SHA)-${{ matrix.artifact }}" >> $env:GITHUB_ENV

      - name: Build Windows binary for image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .docker-windows | Out-Null
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          go build -trimpath -ldflags="-s -w -buildid=" -o .docker-windows\mb.exe .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Windows image
        shell: pwsh
        run: |
          docker version
          docker build --pull --build-arg WINDOWS_BASE=${{ matrix.base }} -f Dockerfile.windows -t $env:WINDOWS_TEMP_TAG .
          docker push $env:WINDOWS_TEMP_TAG

      - name: Export digest
        shell: pwsh
        run: |
          $digestRef = docker image inspect --format='{{index .RepoDigests 0}}' $env:WINDOWS_TEMP_TAG
          if (-not $digestRef -or -not ($digestRef -match "@sha256:")) {
            throw "Could not resolve pushed image digest for $env:WINDOWS_TEMP_TAG"
          }
          $digest = ($digestRef -split "@sha256:")[1]
          $digestDir = Join-Path $env:RUNNER_TEMP "digests"
          New-Item -ItemType Directory -Force $digestDir | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $digestDir $digest) | Out-Null

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.artifact }}
          path: ${{ runner.temp }}\digests\*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: Publish multi-arch manifest
    needs:
      - docker-image
      - windows-container-image
    runs-on: ubuntu-24.04
    steps:
      - name: Set lowercase image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push manifest
        working-directory: /tmp/digests
        shell: bash
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            tag_args+=("-t" "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          sources=()
          for digest in *; do
            sources+=("${IMAGE_NAME}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Inspect manifest
        shell: bash
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          set -euo pipefail
          first_tag="$(jq -r '.tags[0]' <<< "$METADATA_JSON")"
          docker buildx imagetools inspect "$first_tag"
